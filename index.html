<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore Mappa con GPS e DXF (EPSG:3003)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet Locate Control CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        #header {
            height: 60px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            position: relative;
            gap: 10px;
            flex-wrap: wrap;
        }
        #header h1 {
            font-size: 1.1rem;
            margin: 0;
            flex-grow: 1;
            white-space: nowrap;
        }
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        #search-input {
            padding: 7px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.85rem;
            width: 200px;
            outline: none;
        }
        #search-results {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            background: white;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-height: 250px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
        }
        .search-result-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }
        .search-result-item:hover {
            background-color: #3498db;
            color: white;
        }
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn {
            border: none;
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        #map {
            height: calc(100vh - 60px);
            width: 100%;
            z-index: 1;
        }
        #status {
            font-size: 0.8rem;
            color: #ecf0f1;
            white-space: nowrap;
        }
        /* Stile personalizzato per i testi estratti dal DXF */
        .dxf-text-label {
            color: #000;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0px 1px 0 #fff, 0px -1px 0 #fff, 1px 0px 0 #fff, -1px 0px 0 #fff;
            pointer-events: auto;
            cursor: pointer;
        }
        /* Evidenziazione testo selezionato */
        .dxf-text-label-highlight {
            color: #e74c3c !important;
            font-size: 16px !important;
            z-index: 1000 !important;
            text-shadow: 2px 2px 0 #ffff00, -2px -2px 0 #ffff00, 2px -2px 0 #ffff00, -2px 2px 0 #ffff00 !important;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>GPS & DXF (EPSG:3003)</h1>
        
        <!-- Campo Ricerca Testo -->
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="Cerca testo nel DXF..." disabled />
            <div id="search-results"></div>
        </div>

        <span id="status"> Caricamento in corso...</span>
        <div class="file-upload-wrapper">
            <button class="btn">Carica DXF</button>
            <input type="file" id="dxf-input" accept=".dxf" />
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Locate Control JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
    
    <!-- Proj4JS for EPSG transformation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- Dxf Parser -->
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

    <script>
        // Inizializzazione della mappa
        const map = L.map('map').setView([43.7695, 11.2558], 6); // Centro approssimativo sull'Italia (Firenze)

        // Livello Base: OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Controllo GPS (Localizzazione)
        L.control.locate({
            position: 'topleft',
            strings: {
                title: "Mostra la mia posizione"
            },
            locateOptions: {
                enableHighAccuracy: true
            }
        }).addTo(map);

        // Definizione Proiezione EPSG:3003 (Monte Mario / Italy zone 1)
        proj4.defs("EPSG:3003", "+proj=tmerc +lat_0=0 +lon_0=9 +k=0.9996 +x_0=1500000 +y_0=0 +ellps=intl +towgs84=-104.1,-49.1,-9.9,0.971,-2.917,0.714,-11.68 +units=m +no_defs");

        let currentDxfLayer = null;
        let dxfTextItems = []; // Archivio dei testi caricate per la ricerca
        let activeHighlightMarker = null;

        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        // Nome/percorso del file DXF: si trova nella stessa cartella di questo index.html
        const DXF_FILE_PATH = 'ReteAerea.dxf';

        // Caricamento automatico del DXF già presente nella repository
        function loadDxfFromServer(path) {
            document.getElementById('status').innerText = "Caricamento in corso...";
            fetch(path)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(dxfContent => {
                    const parser = new window.DxfParser();
                    const dxfData = parser.parseSync(dxfContent);
                    renderDxf(dxfData);
                    document.getElementById('status').innerText = `Caricato: ${path}`;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('status').innerText = "Errore caricamento automatico.";
                    alert(`Impossibile caricare automaticamente "${path}". Verifica che il file sia presente nella stessa cartella di index.html. Puoi comunque caricarlo manualmente con il pulsante "Carica DXF".`);
                });
        }

        // Gestione caricamento manuale DXF (fallback/opzionale)
        document.getElementById('dxf-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('status').innerText = "Caricamento in corso...";

            reader.onload = function(event) {
                const dxfContent = event.target.result;
                try {
                    const parser = new window.DxfParser();
                    const dxfData = parser.parseSync(dxfContent);
                    renderDxf(dxfData);
                    document.getElementById('status').innerText = `Caricato: ${file.name}`;
                } catch (err) {
                    console.error(err);
                    alert("Errore durante il parsing del file DXF. Assicurati che sia un formato valido.");
                    document.getElementById('status').innerText = "Errore di caricamento.";
                }
            };
            reader.readAsText(file);
        });

        // Avvia il caricamento automatico all'apertura della pagina
        loadDxfFromServer(DXF_FILE_PATH);

        // Rendering del DXF sulla mappa
        function renderDxf(dxf) {
            if (currentDxfLayer) {
                map.removeLayer(currentDxfLayer);
            }
            dxfTextItems = []; // Reset della lista testi
            searchInput.value = '';
            searchResults.style.display = 'none';

            const geojson = {
                type: 'FeatureCollection',
                features: []
            };

            if (dxf.entities && dxf.entities.length > 0) {
                dxf.entities.forEach(entity => {
                    try {
                        if (entity.type === 'LINE') {
                            let pt1, pt2;
                            if (entity.vertices && entity.vertices.length >= 2) {
                                pt1 = entity.vertices[0];
                                pt2 = entity.vertices[1];
                            } else if (entity.startPoint && entity.endPoint) {
                                pt1 = entity.startPoint;
                                pt2 = entity.endPoint;
                            }
                            if (pt1 && pt2) {
                                const p1 = proj4("EPSG:3003", "EPSG:4326", [pt1.x, pt1.y]);
                                const p2 = proj4("EPSG:3003", "EPSG:4326", [pt2.x, pt2.y]);
                                geojson.features.push({
                                    type: 'Feature',
                                    geometry: { type: 'LineString', coordinates: [p1, p2] },
                                    properties: { layer: entity.layer }
                                });
                            }
                        } else if (entity.type === 'LWPOLYLINE' || entity.type === 'POLYLINE') {
                            if (entity.vertices && entity.vertices.length > 0) {
                                let coords = entity.vertices.map(v => proj4("EPSG:3003", "EPSG:4326", [v.x, v.y]));
                                if (entity.shape || (coords[0][0] === coords[coords.length-1][0] && coords[0][1] === coords[coords.length-1][1])) {
                                    if(coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]){
                                        coords.push(coords[0]);
                                    }
                                }
                                geojson.features.push({
                                    type: 'Feature',
                                    geometry: { type: 'LineString', coordinates: coords },
                                    properties: { layer: entity.layer }
                                });
                            }
                        } else if (entity.type === 'POINT') {
                            const p = proj4("EPSG:3003", "EPSG:4326", [entity.position.x, entity.position.y]);
                            geojson.features.push({
                                type: 'Feature',
                                geometry: { type: 'Point', coordinates: p },
                                properties: { layer: entity.layer }
                            });
                        } else if (entity.type === 'CIRCLE' || entity.type === 'ARC') {
                            if (entity.center) {
                                const p = proj4("EPSG:3003", "EPSG:4326", [entity.center.x, entity.center.y]);
                                geojson.features.push({
                                    type: 'Feature',
                                    geometry: { type: 'Point', coordinates: p },
                                    properties: { layer: entity.layer, note: 'Centro Cerchio/Arco' }
                                });
                            }
                        } else if (entity.type === 'TEXT' || entity.type === 'MTEXT') {
                            const pt = entity.startPoint || entity.position;
                            if (pt && entity.text) {
                                const p = proj4("EPSG:3003", "EPSG:4326", [pt.x, pt.y]);
                                // Inclinazione originale del testo nel DXF (in gradi, antioraria, asse Y verso l'alto)
                                const rotationDeg = entity.rotation || 0;
                                geojson.features.push({
                                    type: 'Feature',
                                    geometry: { type: 'Point', coordinates: p },
                                    properties: { 
                                        layer: entity.layer, 
                                        isText: true, 
                                        text: entity.text.trim(),
                                        rotation: rotationDeg
                                    }
                                });
                            }
                        }
                    } catch (e) {
                        console.warn("Errore conversione entità:", entity, e);
                    }
                });
            }

            if (geojson.features.length === 0) {
                alert("Nessuna geometria compatibile trovata nel DXF.");
                return;
            }

            // Aggiunge i dati alla mappa
            currentDxfLayer = L.geoJSON(geojson, {
                style: function (feature) {
                    return {color: "#e74c3c", weight: 2, opacity: 0.9};
                },
                pointToLayer: function (feature, latlng) {
                    if (feature.properties && feature.properties.isText) {
                        // Il DXF misura la rotazione in senso antiorario con l'asse Y verso l'alto;
                        // sullo schermo l'asse Y cresce verso il basso, quindi invertiamo il segno.
                        const rotationDeg = feature.properties.rotation || 0;
                        const screenRotationDeg = -rotationDeg;

                        const marker = L.marker(latlng, {
                            icon: L.divIcon({
                                className: 'dxf-text-label',
                                html: `<span style="display:inline-block; transform: rotate(${screenRotationDeg}deg); transform-origin: left center;">${feature.properties.text}</span>`,
                                iconSize: null,
                                iconAnchor: [0, 0]
                            })
                        });

                        // Salviamo l'elemento nell'elenco di ricerca
                        dxfTextItems.push({
                            text: feature.properties.text,
                            layer: feature.properties.layer,
                            latlng: latlng,
                            marker: marker
                        });

                        // Cliccando sul testo in mappa si apre un popup con i dettagli
                        marker.bindPopup(`<b>Testo:</b> ${feature.properties.text}<br><b>Layer:</b> ${feature.properties.layer}`);

                        return marker;
                    }
                    
                    return L.circleMarker(latlng, {
                        radius: 4,
                        fillColor: "#e74c3c",
                        color: "#c0392b",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                }
            }).addTo(map);

            // Abilita la barra di ricerca se sono stati trovati dei testi
            if (dxfTextItems.length > 0) {
                searchInput.disabled = false;
                searchInput.placeholder = `Cerca tra ${dxfTextItems.length} testi...`;
            } else {
                searchInput.disabled = true;
                searchInput.placeholder = "Nessun testo trovato nel DXF";
            }

            // Centra la mappa sulle geometrie caricate
            map.fitBounds(currentDxfLayer.getBounds());
        }

        // Funzionalità di ricerca testo
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            searchResults.innerHTML = '';

            if (query.length === 0) {
                searchResults.style.display = 'none';
                return;
            }

            const filtered = dxfTextItems.filter(item => item.text.toLowerCase().includes(query));

            if (filtered.length === 0) {
                searchResults.innerHTML = '<div class="search-result-item">Nessun risultato trovato</div>';
            } else {
                filtered.slice(0, 50).forEach(item => { // Limite di 50 risultati visibili nel menu
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `<strong>${item.text}</strong> <small style="color:#777;">(Layer: ${item.layer})</small>`;
                    div.addEventListener('click', function() {
                        zoomToText(item);
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
            }

            searchResults.style.display = 'block';
        });

        // Nascondi lista risultati cliccando altrove
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                searchResults.style.display = 'none';
            }
        });

        // Funzione per volare sul testo cercato ed evidenziarlo
        function zoomToText(item) {
            map.flyTo(item.latlng, 18, { duration: 1.2 });
            
            // Apri popup del marker
            item.marker.openPopup();

            // Effetto visivo di evidenziazione temporanea sul testo
            const iconElem = item.marker.getElement();
            if (iconElem) {
                iconElem.classList.add('dxf-text-label-highlight');
                setTimeout(() => {
                    iconElem.classList.remove('dxf-text-label-highlight');
                }, 3000); // Rimuove l'evidenziazione dopo 3 secondi
            }
        }
    </script>
</body>
</html>
