<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rete Aerea Tranviaria di Torino — Visualizzatore GPS &amp; DXF</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Locate Control CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --------------------------------------------------
           HEADER E RICERCA RESPONSIVA
        -------------------------------------------------- */
        #header {
            flex: 0 0 auto;
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            z-index: 1000;
            gap: 10px;
            flex-wrap: wrap;
        }
        #header h1 {
            font-size: 1rem;
            margin: 0;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .search-wrapper {
            position: relative;
            flex: 1 1 180px;
            min-width: 130px;
        }
        .search-wrapper label {
            display: none;
        }
        .search-wrapper input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.85rem;
            outline: none;
            background-color: #fff;
            color: #333;
        }
        .search-wrapper input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52,152,219,0.5);
        }
        .search-wrapper input[type="text"]:disabled {
            background-color: #eee;
            cursor: not-allowed;
        }
        .search-results {
            position: absolute;
            top: 36px;
            left: 0;
            right: 0;
            background: white;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            max-height: 240px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
        }
        .search-result-item {
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.82rem;
            line-height: 1.3;
        }
        .search-result-item:last-child {
            border-bottom: none;
        }
        .search-result-item:hover {
            background-color: #3498db;
            color: white;
        }
        .search-result-item small {
            color: #777;
        }
        .search-result-item:hover small {
            color: #eaf4fc;
        }
        #status {
            font-size: 0.75rem;
            color: #ecf0f1;
            white-space: nowrap;
            margin-left: auto;
            flex: 0 0 auto;
        }

        /* --------------------------------------------------
           MAPPA
        -------------------------------------------------- */
        #map {
            flex: 1 1 auto;
            width: 100%;
            z-index: 1;
        }

        /* --------------------------------------------------
           STILE TESTI E ETICHETTE DIVISORI
        -------------------------------------------------- */
        .dxf-text-label {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.2px;
            white-space: nowrap;
            pointer-events: auto;
            cursor: pointer;
        }
        .dxf-text-label span {
            display: inline-block;
        }
        .dxf-text-label .label-text {
            color: #ff00ff;
            text-shadow:
                1px 1px 0 #fff,
                -1px -1px 0 #fff,
                1px -1px 0 #fff,
                -1px 1px 0 #fff,
                0px 1px 0 #fff,
                0px -1px 0 #fff,
                1px 0px 0 #fff,
                -1px 0px 0 #fff,
                2px 2px 3px rgba(0,0,0,0.5);
        }
        .dxf-text-label-highlight .label-text {
            color: #e74c3c !important;
            font-size: 16px !important;
            text-shadow:
                1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff,
                0 0 8px #ffff00, 0 0 12px #ffff00 !important;
        }
        .dxf-text-label-highlight {
            z-index: 1000 !important;
        }

        /* --------------------------------------------------
           LEGENDA SULLA MAPPA (Basso a destra)
        -------------------------------------------------- */
        .map-legend {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 0.78rem;
            color: #2c3e50;
            line-height: 1.5;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .map-legend-title {
            font-weight: 700;
            margin-bottom: 4px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }
        .legend-line {
            display: inline-block;
            width: 26px;
            height: 4px;
            border-radius: 2px;
        }
        .legend-line.alimentata {
            background-color: #2ecc71;
        }
        .legend-line.disalimentata {
            background-color: #e74c3c;
        }

        /* --------------------------------------------------
           ADATTAMENTO PER DISPOSITIVI MOBILI (< 600px)
        -------------------------------------------------- */
        @media (max-width: 600px) {
            #header {
                padding: 6px 8px;
                gap: 6px;
            }
            #header h1 {
                font-size: 0.9rem;
                width: 100%;
            }
            .search-wrapper {
                flex: 1 1 48%;
                min-width: 0;
            }
            .search-wrapper input[type="text"] {
                font-size: 0.78rem;
                padding: 5px 8px;
            }
            #status {
                width: 100%;
                text-align: right;
                font-size: 0.7rem;
            }
            .map-legend {
                padding: 6px 10px;
                font-size: 0.72rem;
            }
            .legend-line {
                width: 20px;
                height: 3px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🚊 Rete Aerea Tranviaria — Torino</h1>

        <!-- Ricerca toponomastica -->
        <div class="search-wrapper">
            <label for="address-search-input">Ricerca indirizzo</label>
            <input type="text" id="address-search-input" placeholder="🔎 Indirizzo / via..." autocomplete="off" />
            <div id="address-search-results" class="search-results"></div>
        </div>

        <!-- Ricerca testi nel DXF -->
        <div class="search-wrapper">
            <label for="dxf-search-input">Ricerca testo DXF</label>
            <input type="text" id="dxf-search-input" placeholder="🔧 Testo DXF..." autocomplete="off" disabled />
            <div id="dxf-search-results" class="search-results"></div>
        </div>

        <span id="status">Caricamento in corso...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Locate Control JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>

    <!-- Proj4JS per la trasformazione EPSG:3003 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

    <!-- Dxf Parser -->
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

    <script>
        // ============================================================
        // 1. INIZIALIZZAZIONE MAPPA E RENDERER CANVAS (Per touch preciso su mobile)
        // ============================================================
        const canvasRenderer = L.canvas({ tolerance: 10 });

        const map = L.map('map', {
            renderer: canvasRenderer,
            zoomSnap: 0.5
        }).setView([45.0703, 7.6869], 13); // Centro su Torino

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // GRUPPI LAYER SEPARATI
        const reteAereaGroup = L.layerGroup().addTo(map); // Layer Rete Aerea
        const divisoriGroup = L.layerGroup().addTo(map);  // Layer Divisori ed Etichette

        // Controllo GPS
        L.control.locate({
            position: 'topleft',
            strings: { title: "Mostra la mia posizione" },
            locateOptions: { enableHighAccuracy: true }
        }).addTo(map);

        // Controllo Layer (Gestione Visibilità)
        L.control.layers(
            { "OpenStreetMap": osmLayer },
            { 
                "⚡ Rete Aerea": reteAereaGroup,
                "✂️ Divisori & Etichette": divisoriGroup
            },
            { collapsed: true, position: 'topright' }
        ).addTo(map);

        // ============================================================
        // 2. LEGENDA IN BASSO A DESTRA (Punto 9)
        // ============================================================
        const legendControl = L.control({ position: 'bottomright' });
        legendControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'map-legend');
            div.innerHTML = `
                <div class="map-legend-title">Legenda Stato Rete</div>
                <div class="legend-item">
                    <span class="legend-line alimentata"></span>
                    <span>Alimentata</span>
                </div>
                <div class="legend-item">
                    <span class="legend-line disalimentata"></span>
                    <span>Disalimentata</span>
                </div>
            `;
            return div;
        };
        legendControl.addTo(map);

        // Definizione Proiezione EPSG:3003
        proj4.defs("EPSG:3003", "+proj=tmerc +lat_0=0 +lon_0=9 +k=0.9996 +x_0=1500000 +y_0=0 +ellps=intl +towgs84=-104.1,-49.1,-9.9,0.971,-2.917,0.714,-11.68 +units=m +no_defs");

        let dxfTextItems = [];          // Archivio etichette
        let dxfPolylineLayers = [];     // Archivio polilinee per aggiornamento spessore dinamico
        let addressMarker = null;

        // ============================================================
        // 3. CARICAMENTO E RENDERING DEL DXF
        // ============================================================
        const DXF_FILE_PATH = 'ReteAerea.dxf';
        const statusEl = document.getElementById('status');

        function loadDxfFromServer(path) {
            statusEl.innerText = "Caricamento rete aerea...";
            fetch(path)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(dxfContent => {
                    const parser = new window.DxfParser();
                    const dxfData = parser.parseSync(dxfContent);
                    renderDxf(dxfData);
                    statusEl.innerText = `Rete aerea caricata (${dxfTextItems.length} etichette)`;
                })
                .catch(err => {
                    console.error(err);
                    statusEl.innerText = "Errore caricamento DXF.";
                });
        }
        loadDxfFromServer(DXF_FILE_PATH);

        // Calcolo dello spessore dinamico in base allo zoom (Punto 4)
        function calculateDynamicWeight(zoom) {
            if (zoom <= 13) return 3.2;
            if (zoom <= 15) return 4.2;
            if (zoom <= 17) return 5.2;
            return 6.5;
        }

        function colorIntToHex(v) {
            if (typeof v !== 'number' || isNaN(v) || v < 0) return null;
            return '#' + ('000000' + v.toString(16)).slice(-6);
        }

        const DASH_SCALE = 1.6;
        const MIN_DASH_PX = 3;

        function buildStyleResolvers(dxf) {
            const layers = (dxf.tables && dxf.tables.layer && dxf.tables.layer.layers) || {};
            const lineTypes = (dxf.tables && dxf.tables.lineType && dxf.tables.lineType.lineTypes) || {};

            function resolveColor(entity) {
                const own = colorIntToHex(entity.color);
                if (own) return own;
                const layerDef = layers[entity.layer];
                if (layerDef) {
                    const layerColor = colorIntToHex(layerDef.color);
                    if (layerColor) return layerColor;
                }
                return '#3388ff';
            }

            function resolveDashArray(entity) {
                let ltName = entity.lineType;
                if (!ltName || /^by ?layer$/i.test(ltName)) {
                    const layerDef = layers[entity.layer];
                    ltName = (layerDef && layerDef.lineType) || 'Continuous';
                }
                const lt = lineTypes[ltName];
                if (!lt || !lt.pattern || lt.pattern.length <= 1) return null;
                const segments = lt.pattern.map(v => Math.max(MIN_DASH_PX, Math.round(Math.abs(v) * DASH_SCALE)));
                return segments.join(',');
            }

            return { resolveColor, resolveDashArray };
        }

        function renderDxf(dxf) {
            reteAereaGroup.clearLayers();
            divisoriGroup.clearLayers();
            dxfTextItems = [];
            dxfPolylineLayers = [];
            dxfSearchInput.value = '';
            dxfSearchResults.style.display = 'none';

            const { resolveColor, resolveDashArray } = buildStyleResolvers(dxf);

            const featureBounds = L.latLngBounds();
            const currentZoom = map.getZoom();
            const baseWeight = calculateDynamicWeight(currentZoom);

            if (dxf.entities && dxf.entities.length > 0) {
                dxf.entities.forEach(entity => {
                    try {
                        const layerName = entity.layer || 'Default';
                        const isDivisoriLayer = /DIVISOR/i.test(layerName);
                        const targetGroup = isDivisoriLayer ? divisoriGroup : reteAereaGroup;

                        // GEOMETRIA LINEARE (LINE / POLYLINE / LWPOLYLINE)
                        if (entity.type === 'LINE' || entity.type === 'LWPOLYLINE' || entity.type === 'POLYLINE') {
                            let coords = [];
                            if (entity.type === 'LINE') {
                                let pt1 = entity.vertices ? entity.vertices[0] : entity.startPoint;
                                let pt2 = entity.vertices ? entity.vertices[1] : entity.endPoint;
                                if (pt1 && pt2) {
                                    coords = [
                                        proj4("EPSG:3003", "EPSG:4326", [pt1.x, pt1.y]),
                                        proj4("EPSG:3003", "EPSG:4326", [pt2.x, pt2.y])
                                    ];
                                }
                            } else if (entity.vertices && entity.vertices.length > 0) {
                                coords = entity.vertices.map(v => proj4("EPSG:3003", "EPSG:4326", [v.x, v.y]));
                            }

                            if (coords.length >= 2) {
                                const latLngs = coords.map(c => [c[1], c[0]]);
                                const polyline = L.polyline(latLngs, {
                                    color: resolveColor(entity),
                                    weight: baseWeight,
                                    opacity: 0.95,
                                    dashArray: resolveDashArray(entity) || null,
                                    interactive: true
                                });

                                // Identificazione Layer tramite Clic (Punto 5)
                                polyline.bindPopup(`<b>Layer DXF:</b> ${layerName}`, {
                                    autoPan: true,
                                    closeButton: true
                                });

                                polyline.addTo(targetGroup);
                                dxfPolylineLayers.push(polyline);
                                featureBounds.extend(polyline.getBounds());
                            }
                        }
                        // ETICHETTE E TESTI (TEXT / MTEXT)
                        else if (entity.type === 'TEXT' || entity.type === 'MTEXT') {
                            const pt = entity.startPoint || entity.position;
                            if (pt && entity.text) {
                                const coord = proj4("EPSG:3003", "EPSG:4326", [pt.x, pt.y]);
                                const latlng = L.latLng(coord[1], coord[0]);
                                const rotationDeg = entity.rotation || 0;
                                const screenRotationDeg = -rotationDeg;
                                const color = resolveColor(entity) || '#ff00ff';

                                const marker = L.marker(latlng, {
                                    icon: L.divIcon({
                                        className: 'dxf-text-label',
                                        html: `<span style="display:inline-block; transform: rotate(${screenRotationDeg}deg); transform-origin: left center;"><span class="label-text" style="color:${color};">${entity.text.trim()}</span></span>`,
                                        iconSize: null,
                                        iconAnchor: [0, 0]
                                    })
                                });

                                marker.bindPopup(`<b>Testo:</b> ${entity.text.trim()}<br><b>Layer DXF:</b> ${layerName}`);

                                dxfTextItems.push({
                                    text: entity.text.trim(),
                                    layer: layerName,
                                    latlng: latlng,
                                    marker: marker
                                });

                                featureBounds.extend(latlng);
                            }
                        }
                    } catch (e) {
                        console.warn("Errore parsing entità DXF:", entity, e);
                    }
                });
            }

            // Abilita ricerca testi
            if (dxfTextItems.length > 0) {
                dxfSearchInput.disabled = false;
                dxfSearchInput.placeholder = `🔧 Cerca tra ${dxfTextItems.length} testi DXF...`;
            }

            if (featureBounds.isValid()) {
                map.fitBounds(featureBounds);
            }

            // Aggiorna visibilità etichette e spessori al primo caricamento
            updateLabelAntiCollision();
        }

        // ============================================================
        // 4. ANTI-COLLISIONE DINAMICA ETICHETTE & SPESSORE IN FUNZIONE DELLO ZOOM (Punti 2, 4, 7)
        // ============================================================
        function updateLabelAntiCollision() {
            const currentZoom = map.getZoom();

            // A) Aggiorna lo spessore delle polilinee
            const newWeight = calculateDynamicWeight(currentZoom);
            dxfPolylineLayers.forEach(poly => {
                poly.setStyle({ weight: newWeight });
            });

            // B) Gestione etichette sovrapposte
            if (!map.hasLayer(divisoriGroup)) return;

            // A zoom molto ridotto (< 14) nascondi tutte le etichette per non appesantire
            if (currentZoom < 14) {
                dxfTextItems.forEach(item => {
                    if (divisoriGroup.hasLayer(item.marker)) {
                        divisoriGroup.removeLayer(item.marker);
                    }
                });
                return;
            }

            // Calcola la distanza minima in pixel in base allo zoom per evitare sovrapposizioni
            const visiblePositions = [];
            const minDistancePx = currentZoom < 16 ? 55 : 30;

            dxfTextItems.forEach(item => {
                const point = map.latLngToContainerPoint(item.latlng);

                let isOverlapping = false;
                for (const pos of visiblePositions) {
                    const dx = pos.x - point.x;
                    const dy = pos.y - point.y;
                    if (Math.hypot(dx, dy) < minDistancePx) {
                        isOverlapping = true;
                        break;
                    }
                }

                if (!isOverlapping) {
                    visiblePositions.push(point);
                    if (!divisoriGroup.hasLayer(item.marker)) {
                        divisoriGroup.addLayer(item.marker);
                    }
                } else {
                    if (divisoriGroup.hasLayer(item.marker)) {
                        divisoriGroup.removeLayer(item.marker);
                    }
                }
            });
        }

        // Eventi mappa per aggiornamento continuo al variare dello zoom o spostamento
        map.on('zoomend moveend', updateLabelAntiCollision);

        // ============================================================
        // 5. RICERCA TOPONOMASTICA (Nominatim OSM)
        // ============================================================
        const addressSearchInput = document.getElementById('address-search-input');
        const addressSearchResults = document.getElementById('address-search-results');
        let addressSearchTimeout = null;
        let addressSearchAbortController = null;

        addressSearchInput.addEventListener('input', function () {
            const query = this.value.trim();
            clearTimeout(addressSearchTimeout);

            if (query.length < 3) {
                addressSearchResults.style.display = 'none';
                addressSearchResults.innerHTML = '';
                return;
            }

            addressSearchTimeout = setTimeout(() => {
                searchAddress(query);
            }, 400);
        });

        function searchAddress(query) {
            if (addressSearchAbortController) addressSearchAbortController.abort();
            addressSearchAbortController = new AbortController();

            addressSearchResults.innerHTML = '<div class="search-result-item">Ricerca in corso...</div>';
            addressSearchResults.style.display = 'block';

            const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6` +
                `&viewbox=7.55,45.15,7.75,45.00&bounded=0&countrycodes=it&q=${encodeURIComponent(query)}`;

            fetch(url, { signal: addressSearchAbortController.signal, headers: { 'Accept-Language': 'it' } })
                .then(r => r.json())
                .then(results => {
                    addressSearchResults.innerHTML = '';
                    if (!results || results.length === 0) {
                        addressSearchResults.innerHTML = '<div class="search-result-item">Nessun risultato trovato</div>';
                        return;
                    }
                    results.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerHTML = `<strong>${item.display_name.split(',')[0]}</strong><br><small>${item.display_name}</small>`;
                        div.addEventListener('click', function () {
                            const lat = parseFloat(item.lat);
                            const lon = parseFloat(item.lon);
                            if (addressMarker) map.removeLayer(addressMarker);
                            addressMarker = L.marker([lat, lon]).addTo(map);
                            addressMarker.bindPopup(`<b>${item.display_name}</b>`).openPopup();
                            map.flyTo([lat, lon], 17, { duration: 1.2 });
                            addressSearchResults.style.display = 'none';
                        });
                        addressSearchResults.appendChild(div);
                    });
                    addressSearchResults.style.display = 'block';
                })
                .catch(err => {
                    if (err.name === 'AbortError') return;
                    addressSearchResults.innerHTML = '<div class="search-result-item">Errore nella ricerca</div>';
                });
        }

        // ============================================================
        // 6. RICERCA TESTI DXF
        // ============================================================
        const dxfSearchInput = document.getElementById('dxf-search-input');
        const dxfSearchResults = document.getElementById('dxf-search-results');

        dxfSearchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            dxfSearchResults.innerHTML = '';

            if (query.length === 0) {
                dxfSearchResults.style.display = 'none';
                return;
            }

            const filtered = dxfTextItems.filter(item => item.text.toLowerCase().includes(query));

            if (filtered.length === 0) {
                dxfSearchResults.innerHTML = '<div class="search-result-item">Nessun risultato trovato</div>';
            } else {
                filtered.slice(0, 40).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `<strong>${item.text}</strong> <small>(Layer: ${item.layer})</small>`;
                    div.addEventListener('click', function () {
                        // Assicurati che l'etichetta sia visibile nel gruppo
                        if (!divisoriGroup.hasLayer(item.marker)) {
                            divisoriGroup.addLayer(item.marker);
                        }
                        map.flyTo(item.latlng, 18, { duration: 1.2 });
                        item.marker.openPopup();

                        const iconElem = item.marker.getElement();
                        if (iconElem) {
                            iconElem.classList.add('dxf-text-label-highlight');
                            setTimeout(() => iconElem.classList.remove('dxf-text-label-highlight'), 3000);
                        }
                        dxfSearchResults.style.display = 'none';
                    });
                    dxfSearchResults.appendChild(div);
                });
            }

            dxfSearchResults.style.display = 'block';
        });

        // Chiusura dei menu di ricerca al clic esterno
        document.addEventListener('click', function (e) {
            if (!e.target.closest('#address-search-input') && !e.target.closest('#address-search-results')) {
                addressSearchResults.style.display = 'none';
            }
            if (!e.target.closest('#dxf-search-input') && !e.target.closest('#dxf-search-results')) {
                dxfSearchResults.style.display = 'none';
            }
        });
    </script>
</body>
</html>
